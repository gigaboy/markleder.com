<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Leder Website</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            margin-top: 150px; /* room for the 75% of the avatar above the container */
            padding-top: 50px; /* clear the 25% of the avatar inside the container */
        }
        .container h1 {
            margin-top: 0.5rem;
        }
        .avatar {
            position: absolute;
            top: -150px; /* bottom 50px (25% of 200px) overlaps the container */
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="assets/images/markLeder2025-200px-circle.png" alt="Mark Leder" width="200" height="200">
        <h1>Mark Leder</h1>
        <h2>Columbus, Ohio USA</h2>
        <p>Coming Soon!</p>
    </div>
</body>
</html>
